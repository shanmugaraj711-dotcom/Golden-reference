<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Founder Admin Control</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:40px auto;padding:0 20px;background:#f7f8fa;color:#18202a}main{background:#fff;border:1px solid #e2e6eb;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0000000a}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:650;margin-bottom:6px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd6df;border-radius:10px;font:inherit}textarea{min-height:100px}button{cursor:pointer;background:#111827;color:#fff;border:0;font-weight:700}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.secondary{background:#eef1f5;color:#18202a}.status{margin:18px 0;padding:14px;border-radius:12px;background:#f1f5f9;white-space:pre-wrap}.danger{color:#b42318}.ok{color:#067647}@media(max-width:700px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main><h1>Founder / Admin Control</h1><p>Secure founder session. Your admin key is used once to establish a short-lived HTTP-only session and is never stored.</p><div class="grid"><div><label>Project ID</label><input id="projectId" placeholder="Loading latest project…"></div><div><label>Founder admin key</label><input id="key" type="password" autocomplete="current-password" placeholder="FACTORY_ADMIN_KEY"></div><div><label>Start step</label><input id="start" type="number" min="1" max="10" value="1"></div><div><label>End step</label><input id="end" type="number" min="1" max="10" value="10"></div><div><label>Output target</label><select id="target"><option>web</option><option>android</option><option>ios</option><option>other</option></select></div><div><label>Instruction</label><input id="instruction" placeholder="Factory instruction"></div></div><div class="actions"><button onclick="login()">Authenticate founder</button><button onclick="send('start')">Start range</button><button onclick="send('claim')">Claim next run</button><button class="secondary" onclick="send('pause')">Pause</button><button class="secondary" onclick="send('resume')">Resume</button><button class="secondary" onclick="send('approve')">Approve</button><button class="secondary" onclick="loadState()">Refresh state</button></div><div id="status" class="status">Loading project…</div><script>const el=id=>document.getElementById(id);let session=false;async function json(path,opts={}){const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}async function loadProject(){try{const d=await json('/api/projects');const p=d.project||{};el('projectId').value=p.projectId||'';el('status').textContent=`Project: ${p.projectName||'—'}\nState: ${p.lifecycleState||'—'}\nVersion: ${p.currentVersion||'—'}\nProject ID: ${p.projectId||'—'}`}catch(e){el('status').innerHTML='<span class="danger">'+e.message+'</span>'}}async function login(){try{await json('/api/factory-auth',{headers:{'X-Factory-Admin-Key':el('key').value.trim()}});session=true;el('status').innerHTML='<span class="ok">Founder authenticated. Session active for 60 minutes.</span>';await loadState()}catch(e){el('status').innerHTML='<span class="danger">'+e.message+'</span>'}}async function loadState(){try{if(!session)throw Error('Authenticate founder first');const id=el('projectId').value.trim();const d=await json(`/api/factory?projectId=${encodeURIComponent(id)}`);el('status').textContent=JSON.stringify(d.factory,null,2)}catch(e){el('status').innerHTML='<span class="danger">'+e.message+'</span>'}}async function send(action){try{if(!session)throw Error('Authenticate founder first');const body={action,projectId:el('projectId').value.trim(),startStep:Number(el('start').value),endStep:Number(el('end').value),outputTarget:el('target').value,instruction:el('instruction').value.trim()};if(action==='start'&&!body.instruction)body.instruction='Run the selected factory lifecycle range and persist evidence.';const d=await json('/api/factory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});el('status').textContent=JSON.stringify(d.factory,null,2)}catch(e){el('status').innerHTML='<span class="danger">'+e.message+'</span>'}}loadProject();</script></main></body></html>
