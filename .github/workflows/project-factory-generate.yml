name: Project Factory Generate

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Customer project request"
        required: true
        default: "Build a simple responsive coffee shop landing page with hero, menu, hours, and contact section."

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FACTORY_REQUEST: ${{ inputs.request }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      FACTORY_WORKSPACE: generated-project
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gemini secret
        run: test -n "$GEMINI_API_KEY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate project files
        run: python scripts/gemini_project_worker.py

      - name: Run generated-project build gate
        run: python scripts/project_gate.py

      - name: Create delivery manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("generated-project")
          files = []
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              data = p.read_bytes()
              files.append({"path": str(p.relative_to(root)), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          manifest = {"request": os.environ["FACTORY_REQUEST"], "model": os.environ["GEMINI_MODEL"], "gate": "passed", "files": files}
          Path("generated-project/factory-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

      - name: Package generated project
        run: tar -czf project-factory-output.tgz -C generated-project .

      - name: Upload generated project
        uses: actions/upload-artifact@v4
        with:
          name: project-factory-output
          path: project-factory-output.tgz
          if-no-files-found: error
