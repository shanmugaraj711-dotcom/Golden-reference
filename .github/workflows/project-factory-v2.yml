name: Project Factory V2

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Customer project request"
        required: true
        default: "Build a simple responsive coffee shop landing page with hero, menu, hours, and contact section."
      project_name:
        description: "Delivery project name"
        required: true
        default: "factory-demo"
      delivery_mode:
        description: "Customer model: transfer, deploy, or managed"
        required: true
        default: "deploy"
      destination_repo:
        description: "Optional destination repo owner/name"
        required: false
        default: ""
      destination_branch:
        description: "Destination branch"
        required: true
        default: "main"
      destination_url:
        description: "Optional live URL for post-delivery health check"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  build-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      FACTORY_REQUEST: ${{ inputs.request }}
      FACTORY_WORKSPACE: generated-project
      PROJECT_NAME: ${{ inputs.project_name }}
      DELIVERY_MODE: ${{ inputs.delivery_mode }}
      DESTINATION_REPO: ${{ inputs.destination_repo }}
      DESTINATION_BRANCH: ${{ inputs.destination_branch }}
      DESTINATION_URL: ${{ inputs.destination_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and Gemini secret
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          case "$DELIVERY_MODE" in
            transfer|deploy|managed) ;;
            *) echo "Unsupported delivery mode: $DELIVERY_MODE"; exit 1 ;;
          esac
          test -n "$PROJECT_NAME"
          test -n "$DESTINATION_BRANCH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate project
        run: python scripts/gemini_project_worker.py

      - name: Validate generated project
        run: python scripts/project_gate.py

      - name: Create delivery manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("generated-project")
          files=[]
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              data=p.read_bytes()
              files.append({"path":str(p.relative_to(root)),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          manifest={
              "project_name":os.environ["PROJECT_NAME"],
              "delivery_mode":os.environ["DELIVERY_MODE"],
              "request":os.environ["FACTORY_REQUEST"],
              "model":os.environ["GEMINI_MODEL"],
              "gate":"passed",
              "destination_repo":os.environ.get("DESTINATION_REPO", ""),
              "destination_branch":os.environ["DESTINATION_BRANCH"],
              "live_url":os.environ.get("DESTINATION_URL", ""),
              "handoff_required":os.environ["DELIVERY_MODE"] in ("transfer", "deploy"),
              "maintenance_expected":os.environ["DELIVERY_MODE"] == "managed",
              "files":files,
          }
          (root/"factory-manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          PY

      - name: Prepare verified delivery
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_DELIVERY_TOKEN: ${{ secrets.FACTORY_DELIVERY_TOKEN }}
        run: |
          set -euo pipefail
          SAFE_NAME=$(printf '%s' "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed 's/^-*//;s/-*$//')
          BRANCH="factory-delivery/${SAFE_NAME}-${GITHUB_RUN_ID}"
          git config user.name "Project Factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -c "$BRANCH"
          rm -rf .factory-output
          mkdir -p .factory-output
          cp -R generated-project/. .factory-output/
          git add .factory-output
          git commit -m "factory: deliver ${SAFE_NAME}"
          git push origin "$BRANCH"
          echo "source_branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ -n "$DESTINATION_REPO" ] && [ -n "$FACTORY_DELIVERY_TOKEN" ]; then
            rm -rf /tmp/factory-destination
            git clone "https://x-access-token:${FACTORY_DELIVERY_TOKEN}@github.com/${DESTINATION_REPO}.git" /tmp/factory-destination
            cd /tmp/factory-destination
            git checkout "$DESTINATION_BRANCH"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R "$GITHUB_WORKSPACE/generated-project/." ./
            git config user.name "Project Factory"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "factory: deliver ${SAFE_NAME}" || true
            git push origin "$DESTINATION_BRANCH"
            echo "destination_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "destination_published=false" >> "$GITHUB_OUTPUT"
            echo "No destination token/repo supplied; source delivery branch remains the verified handoff artifact."
          fi

          if gh pr create --base main --head "$BRANCH" --title "factory: deliver ${SAFE_NAME}" --body "Automated Project Factory V2 delivery. Generated and validated by the Factory. Review before merging. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --draft >/tmp/pr-url 2>/tmp/pr-error; then
            echo "pull_request_created=true" >> "$GITHUB_OUTPUT"
            cat /tmp/pr-url
          else
            echo "pull_request_created=false" >> "$GITHUB_OUTPUT"
            echo "PR creation unavailable under current GitHub Actions policy; branch publication succeeded."
          fi

      - name: Verify destination URL
        if: ${{ inputs.destination_url != '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          url=os.environ["DESTINATION_URL"].rstrip("/")
          with urllib.request.urlopen(url, timeout=20) as r:
              body=r.read().decode("utf-8", errors="replace")
              if r.status != 200:
                  raise SystemExit(f"health check failed: HTTP {r.status}")
              print(f"destination health: HTTP {r.status}")
              print(body[:500])
          PY

      - name: Package evidence
        run: tar -czf project-factory-v2-output.tgz -C generated-project .

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-factory-v2-${{ github.run_id }}
          path: project-factory-v2-output.tgz
          if-no-files-found: error

      - name: Delivery summary
        run: |
          echo "Project Factory V2 complete"
          echo "mode=$DELIVERY_MODE"
          echo "project=$PROJECT_NAME"
          echo "destination_repo=${DESTINATION_REPO:-none}"
          echo "destination_branch=$DESTINATION_BRANCH"
          echo "destination_url=${DESTINATION_URL:-none}"
          echo "handoff_required=$([ "$DELIVERY_MODE" = transfer ] || [ "$DELIVERY_MODE" = deploy ] && echo true || echo false)"
          echo "maintenance_expected=$([ "$DELIVERY_MODE" = managed ] && echo true || echo false)"
