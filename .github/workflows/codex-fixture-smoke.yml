name: Gemini Fixture Smoke

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "Controlled instruction for the sample fixture"
        required: true
        default: "Inspect the fixture, make one small safe improvement, and report exactly what changed. Do not access secrets or modify files outside the fixture."

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIXTURE_INSTRUCTION: ${{ inputs.instruction }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gemini credential is configured
        run: test -n "$GEMINI_API_KEY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Project Factory Gemini adapter against fixture
        run: python scripts/gemini_fixture_smoke.py "$FIXTURE_INSTRUCTION"
