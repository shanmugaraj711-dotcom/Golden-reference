<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Factory — Customer Dashboard</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:24px;background:#f6f7fb;color:#15171a}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eee}.ok{background:#dff7e8}.warn{background:#fff3cd}.err{background:#fde2e2}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;margin-right:8px}a{word-break:break-all}</style></head><body><h1 id="title">Project Factory</h1><p id="subtitle">Loading project evidence…</p><div class="card"><strong>Current status</strong><h2 id="status">LOADING</h2><p id="next"></p></div><div class="grid"><div class="card"><b>Delivery</b><p id="delivery">—</p><p id="version">—</p></div><div class="card"><b>Verification</b><p id="verification">—</p></div><div class="card"><b>Ownership</b><p id="ownership">—</p></div></div><div class="card"><b>Live project</b><p id="live">—</p></div><div class="card"><b>Customer actions</b><div id="actions"></div></div><div class="card"><b>Evidence timeline</b><ol id="timeline"></ol></div><script>
const fallback={projectName:'Factory Demo',brief:'Customer project',deliveryModel:'deploy',version:'1.0.0',state:'LIVE',nextAction:'View the live project',repository:'',hostingTarget:'Vercel',productionUrl:'',qualityGate:'PASS',deployment:'VERIFIED',healthCheck:'PASS',ownership:'Customer',maintenance:'Not enrolled',events:[]};
const params=new URLSearchParams(location.search);const source=params.get('data');
async function load(){let d=fallback;try{const url=source||'/project.json';const r=await fetch(url,{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}render(d)}
function cls(s){return /PASS|VERIFIED|LIVE|HANDED_OFF|MANAGED/.test(s)?'ok':/FAILED|BLOCKED/.test(s)?'err':'warn'}
function render(d){document.title=`${d.projectName||'Project'} — Factory`;document.querySelector('#title').textContent=d.projectName||'Project Factory';document.querySelector('#subtitle').textContent=d.brief||'';const st=document.querySelector('#status');st.textContent=d.state||'UNKNOWN';st.className='pill '+cls(d.state||'');document.querySelector('#next').textContent=d.nextAction||'';document.querySelector('#delivery').textContent=`Model: ${d.deliveryModel||'—'} | Hosting: ${d.hostingTarget||'—'}`;document.querySelector('#version').textContent=`Version: ${d.version||'—'}`;document.querySelector('#verification').innerHTML=`Quality: <b>${d.qualityGate||'—'}</b><br>Deployment: <b>${d.deployment||'—'}</b><br>Health: <b>${d.healthCheck||'—'}</b>`;document.querySelector('#ownership').textContent=d.ownership||'—';document.querySelector('#live').innerHTML=d.productionUrl?`<a href="${d.productionUrl}" target="_blank" rel="noopener">${d.productionUrl}</a>`:'No production URL';const a=document.querySelector('#actions');if(d.state==='REVIEW')a.innerHTML='<button onclick="alert(\'Approval recorded by customer workflow\')">Approve preview</button><button onclick="alert(\'Change request recorded\')">Request changes</button>';else a.textContent=d.state==='LIVE'?'Project is live and verified.':'No customer action required yet.';const t=document.querySelector('#timeline');t.innerHTML='';(d.events||[]).forEach(e=>{const li=document.createElement('li');li.textContent=`${e.time||''} — ${e.label||e.state||''}`;t.appendChild(li)})}load();setInterval(load,30000);
</script></body></html>
